; Production php.ini for FrankenPHP worker mode

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; FrankenPHP worker mode: persist state across requests
opcache.preload=/app/config/preload.php
opcache.preload_user=nobody

realpath_cache_size=4096K
realpath_cache_ttl=600

; Never advertise the interpreter version in a response header.
; The FrankenPHP base image leaves expose_php=On, so state this explicitly
; rather than inheriting it (GUIDING-LIGHT §6.4).
expose_php=Off

; Production error reporting
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2

; Session handling
session.cookie_httponly=1
session.use_strict_mode=1
session.cookie_samesite=Lax

; Increase limits for receipt parsing payloads
upload_max_filesize=10M
post_max_size=10M
