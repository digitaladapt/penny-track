services:
  app:
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: c5c63d1b5a6f38a712b888be6dd126c2
      FRANKENPHP_WORKER: 0
    volumes:
      # Mount source code for live editing (vendor/ from the image is preserved)
      - ./src:/app/src:ro
      - ./templates:/app/templates:ro
      - ./config:/app/config:ro
      - ./translations:/app/translations:ro
      - ./public:/app/public:rw
      - ./migrations:/app/migrations:ro
      - app_data:/app/var

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  app_data:
