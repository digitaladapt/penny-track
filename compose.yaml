services:
  penny-track:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: penny-track
    expose:
      - 80
    environment:
      # `${VAR:?}` rather than `${VAR:-}`: an empty APP_SECRET is a silent
      # security failure, not a convenience. Refuse to start, and name the
      # variable (GUIDING-LIGHT §4.4).
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required — generate one with openssl rand -hex 32}
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/penny_track.db"
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required — the LLM provider API key}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-10}
      MAX_BACKGROUND_JOBS: ${MAX_BACKGROUND_JOBS:-2}
      LLM_WORKER_TIMEOUT: ${LLM_WORKER_TIMEOUT:-600}
      PARSE_JOB_MAX_ATTEMPTS: ${PARSE_JOB_MAX_ATTEMPTS:-1}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      BUDGET_GOAL: ${BUDGET_GOAL:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,PRIVATE_SUBNETS}
    restart: unless-stopped
    volumes:
      - ./var:/app/var

