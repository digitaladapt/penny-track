networks:
  public:
    external: true

services:
  penny-track:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: penny-track
    expose:
      - 80
    environment:
      APP_SECRET: ${APP_SECRET:-}
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/penny_track.db"
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-10}
      MAX_BACKGROUND_JOBS: ${MAX_BACKGROUND_JOBS:-2}
      LLM_WORKER_TIMEOUT: ${LLM_WORKER_TIMEOUT:-600}
      PARSE_JOB_MAX_ATTEMPTS: ${PARSE_JOB_MAX_ATTEMPTS:-1}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      BUDGET_GOAL: ${BUDGET_GOAL:-0}
    restart: unless-stopped
    networks:
      - public
    volumes:
      - ./var/data:/app/var/data

